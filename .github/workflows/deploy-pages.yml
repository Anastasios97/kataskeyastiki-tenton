name: Redirect GitHub Pages to the main domain

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Το site ζει στο www.kataskeuastiki-tenton.com (Vercel). Εδώ το παλιό
      # αντίγραφο του GitHub Pages γίνεται ανακατευθύνσεις προς το domain.
      - name: Build redirects to the main domain
        env:
          VITE_SITE_URL: https://www.kataskeuastiki-tenton.com
        run: |
          npm run build
          node scripts/pages-redirect.mjs dist-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Redirect GitHub Pages to the main domain
        id: deployment
        uses: actions/deploy-pages@v4
